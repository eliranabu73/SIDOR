<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>

      background: #0f172a; color: #f8fafc; text-align: center;

  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="1.8" stroke-linecap="round">

  <button onclick="location.reload()">נסה שוב</button>
